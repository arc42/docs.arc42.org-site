<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!--
    arc42 icon sprite.

    Replaces assets/css/all.css (4634 lines of FontAwesome) and the sixteen
    webfont files in assets/webfonts/. Every glyph the site actually used is
    here, drawn from scratch on a 24x24 grid as a single stroke family:
    stroke-width 1.75, round caps and joins, no fills. None of FontAwesome's
    outlines were copied; the brand marks are simplified outline renditions in
    the simple-icons manner rather than traced logos.

    The presentation attributes sit on each <g> on purpose. `.icon` in
    _utilities.scss declares `fill: currentColor`, which inherits into the
    shadow tree of a <use>; a presentation attribute on the element itself
    outranks an inherited value, so `fill="none"` here always wins and the
    icons cannot fill in.

    Use via {% include icon.html name="github" label="GitHub" %} — never by
    hand-writing the <use> element, so the aria treatment stays consistent.

    Old FontAwesome name        -> symbol id
      fa-bars                   -> menu
      fa-tags                   -> tags
      fa-user                   -> user
      fa-link                   -> link
      fa-envelope               -> envelope
      fa-user-secret            -> user-secret
      fa-chart-bar              -> chart-bar
      fa-heart                  -> heart
      fab fa-github             -> github
      fab fa-mastodon           -> mastodon
      fab fa-youtube            -> youtube
      fab fa-dev                -> dev
      fab fa-stack-overflow     -> stack-overflow
      fab fa-linkedin           -> linkedin        (contact page; not in the brief's list)
    New for this design: search, chevron-down.
  -->

  <!-- ==== UI ============================================================ -->

  <symbol id="menu" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 7h16M4 12h16M4 17h16"/>
    </g>
  </symbol>

  <symbol id="search" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10.8" cy="10.8" r="6.3"/>
      <path d="m15.6 15.6 4.4 4.4"/>
    </g>
  </symbol>

  <symbol id="chevron-down" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="m6 9.5 6 6 6-6"/>
    </g>
  </symbol>

  <symbol id="link" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.5 14.5a4 4 0 0 0 5 0l3-3a4 4 0 0 0-5-5l-1.5 1.5"/>
      <path d="M14.5 9.5a4 4 0 0 0-5 0l-3 3a4 4 0 0 0 5 5l1.5-1.5"/>
    </g>
  </symbol>

  <symbol id="tags" viewBox="0 0 24 24">
    <!-- A single tag, not the two overlapping ones FontAwesome drew: at 1em the
         second tag was three pixels of noise behind the first. -->
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12.1 3.5H5.5a2 2 0 0 0-2 2v6.6a2 2 0 0 0 .6 1.4l6.9 6.9a2 2 0 0 0 2.8 0l6.6-6.6a2 2 0 0 0 0-2.8l-6.9-6.9a2 2 0 0 0-1.4-.6z"/>
      <circle cx="7.9" cy="7.9" r="1.2"/>
    </g>
  </symbol>

  <symbol id="user" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8.3" r="3.8"/>
      <path d="M4.6 20.5a7.4 7.4 0 0 1 14.8 0"/>
    </g>
  </symbol>

  <symbol id="user-secret" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7.9 9.4V8.2c0-2.3 1.8-4.2 4.1-4.2s4.1 1.9 4.1 4.2v1.2"/>
      <path d="M3.8 9.4h16.4"/>
      <path d="M9 9.4v1.7a3 3 0 0 0 6 0V9.4"/>
      <path d="M9.4 12.2h5.2"/>
      <path d="M5 20.5c0-2.8 3.1-4.4 7-4.4s7 1.6 7 4.4"/>
    </g>
  </symbol>

  <symbol id="envelope" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="5.5" width="17" height="13" rx="2"/>
      <path d="m4.2 6.7 7.8 5.4 7.8-5.4"/>
    </g>
  </symbol>

  <symbol id="chart-bar" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 4v15.5h16"/>
      <path d="M8.5 19.5v-4.5"/>
      <path d="M13 19.5v-8"/>
      <path d="M17.5 19.5v-6"/>
    </g>
  </symbol>

  <symbol id="heart" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20.3 4.6 12.9a4.7 4.7 0 0 1 6.5-6.5l.9.9.9-.9a4.7 4.7 0 0 1 6.5 6.5z"/>
    </g>
  </symbol>

  <!-- ==== Brand marks =================================================== -->
  <!-- Simplified outlines in the same stroke family, drawn from the public
       shape of each mark. Where a mark contains lettering (dev.to, LinkedIn)
       the letters take a lighter 1.3 weight: at 1em a 1.75 stroke closes the
       counters and the glyphs read as solid blobs. -->

  <symbol id="github" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15.2 21.5v-3.6c0-1-.2-1.6-.6-2 2.5-.3 5.2-1.3 5.2-5.7 0-1.2-.4-2.3-1.2-3.1.1-.3.5-1.5-.1-3.1 0 0-1-.3-3.3 1.2a11.4 11.4 0 0 0-6.1 0C6.8 3.7 5.8 4 5.8 4c-.6 1.6-.2 2.8-.1 3.1-.8.8-1.2 1.9-1.2 3.1 0 4.4 2.7 5.4 5.2 5.7-.4.4-.6.9-.6 1.6v3.9"/>
      <path d="M9.1 19.6c-4 1.2-4-2.1-5.7-2.5"/>
    </g>
  </symbol>

  <symbol id="mastodon" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.8 14.6c-.4-1.8-.5-3.8-.5-5.4C4.3 5.6 6.9 3.6 12 3.6s7.7 2 7.7 5.6c0 1.6-.1 3.6-.5 5.4-.4 1.5-2.4 2.5-4.6 2.8-1.8.2-3.6.2-5.4 0-2.2-.3-4.2-1.3-4.4-2.8z"/>
      <path d="M8.9 17.3v1.7c0 1 1.4 1.6 3.1 1.6s3.1-.6 3.1-1.6v-1.7"/>
      <path d="M15.4 13.2v-3.4c0-.7-.2-1.3-.6-1.7-.4-.4-.9-.6-1.5-.6-.7 0-1.3.3-1.7.9l-.4.7-.4-.7c-.4-.6-1-.9-1.7-.9-.6 0-1.1.2-1.5.6-.4.4-.6 1-.6 1.7v3.4"/>
    </g>
  </symbol>

  <symbol id="youtube" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="5" width="19" height="14" rx="3.5"/>
      <path d="m10.3 8.9 5 3.1-5 3.1z"/>
    </g>
  </symbol>

  <symbol id="dev" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="5" width="19" height="14" rx="3"/>
    </g>
    <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.2 9.9v4.2h.9c.9 0 1.4-.5 1.4-1.4v-1.4c0-.9-.5-1.4-1.4-1.4z"/>
      <path d="M13.4 9.9h-2.6v4.2h2.6M10.8 12h2"/>
      <path d="m15.3 9.9 1.4 4.2 1.4-4.2"/>
    </g>
  </symbol>

  <symbol id="stack-overflow" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17.4 14.6V20H5.6v-5.4"/>
      <path d="M8.2 17.4h7.4"/>
      <path d="m8.4 14.1 7.3.9"/>
      <path d="m8.9 11.5 7.1 1.9"/>
      <path d="M10 9.1 16.6 12.2"/>
      <path d="m11.8 6.9 5.8 4.3"/>
    </g>
  </symbol>

  <symbol id="linkedin" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="2.5" width="19" height="19" rx="3.5"/>
    </g>
    <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7.6 10.6v6"/>
      <path d="M7.6 7.6h.01"/>
      <path d="M11.6 16.6v-6"/>
      <path d="M16.4 16.6v-3.4a2.4 2.4 0 0 0-4.8 0"/>
    </g>
  </symbol>
</svg>
