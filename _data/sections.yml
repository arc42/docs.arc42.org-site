# The twelve arc42 template sections — the single source of truth.
#
# Consumed by:
#   _includes/rail.html      — the left navigation rail
#   _pages/home.md           — the section directory on the home page
#   _includes/stepper.html   — the prev/next stepper at the foot of a section page
#   _includes/breadcrumb.html
#
# Before this file, the same twelve sections were described in three places: twelve
# {% assign nr_secNN_tips %} lines plus a hand-written list in _pages/home.md, and a
# `site.pages | sort: 'order'` loop in _layouts/default.html. Add a section here, or
# rename one, and every view follows.
#
# Fields
#   number     1-12, the arc42 section number. Rendered zero-padded in the nav rail.
#   name       Short form for navigation and the directory. The page's own <h1> still
#              comes from its front-matter `title` ("3 - Context and scope").
#   blurb      One line: what belongs in this section. Copy is the site's own, carried
#              over from _pages/home.md — not rewritten.
#   category   Matches the `category:` front matter on _posts/**, so tip counts are
#              `site.posts | where: "category", section.category | size`.
#   permalink  Matches the `permalink:` front matter on _pages/section-N.md.
#   examples_slug  The matching page on examples.arc42.org, at
#              <examples_url>/sections/<examples_slug>/. It is that site's own
#              section filename, asserted against its template by
#              scripts/check-sections.sh over there — which is what makes these
#              twelve hard-coded strings safe. Renaming one is one word here.

