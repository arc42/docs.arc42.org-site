<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}docs-arc42-brain{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <header class="masthead">
    <a class="masthead-brand" href="/">docs-arc42-brain</a>
    <nav class="masthead-nav">
      {% block nav %}
      <a href="/">Home</a>
      <a href="/sections">Sections</a>
      <a href="/tips">Tips</a>
      <a href="/examples">Examples</a>
      <a href="/tags">Tags</a>
      <a href="/issues">Issues</a>
      <a href="/graph">Graph</a>
      <a href="/actions">Actions</a>
      <details class="nav-more">
        <summary>More &#9662;</summary>
        <div class="nav-more-menu">
          <a href="/terms">Terms</a>
          <a href="/keywords">Keywords</a>
          <a href="/systems">Systems</a>
          <a href="/lint">Lint</a>
          <a href="/review">Review</a>
          <a href="/cutover">Cut-over</a>
          <a href="/gaps">Gaps</a>
          <a href="/suggestions">Suggestions</a>
          <a href="/log">Log</a>
          <a href="/links">Links</a>
        </div>
      </details>
      {% endblock %}
    </nav>
    <form class="masthead-search" method="get" action="/search">
      <input type="search" name="q" placeholder="Search…" aria-label="Search">
      <button type="submit">Search</button>
    </form>
    <form class="masthead-reload" method="post" action="/reload">
      <button type="submit" title="Clear the cached vault and reload">Reload</button>
    </form>
  </header>
  <main>{% block main %}{% endblock %}</main>
  <footer class="footer">
    <span id="presence-count"></span>
    <a href="/who">Who's here</a>
  </footer>
</body>
</html>
