services:
  jekyll:
    build: .
    image: docs-arc42-site:latest
    init: true
    environment:
      JEKYLL_ENV: development
      POLLING: "--force_polling"
    volumes:
      - .:/site
      - jekyll_cache:/site/.jekyll-cache
      - sass_cache:/site/.sass-cache
    # 4210 is this site's fixed dev port (see raw/port-assignment.md in
    # meta.arc42.org). --port is passed to Jekyll as well as mapped: Jekyll's
    # "Server address:" banner reports whatever port it is told to bind, so a
    # bare 4210:4000 mapping would leave it announcing 4000 while the site
    # answered on 4210.
    ports:
      - '4210:4210'
    # No --incremental: full rebuild on change. Incremental silently
    # leaves stale/relocated output when permalinks or front matter change.
    command: >
      sh -c "bundle exec jekyll serve --host 0.0.0.0 --port 4210 --watch $${POLLING}"

volumes:
  jekyll_cache:
  sass_cache:
