#
# URL settings
#
# these need to be adjusted depending on target platform,
# local Jekyll need different settings than github-pages :-(

# deployment with github-pages on custom domain
url: https://docs.arc42.org
imageurl: /assets/images/sections
exampleimages: /assets/images/examples


#url: https://localhost:4000
#imageurl: https://localhost:4000/images

baseurl:

# temporary deployment on arc42.github.io/faq
# -----------------------------------------------------
#url: https://arc42.github.io
#baseurl: "/faq"




#
# basic settings
#
title: arc42 Documentation
description: how to use the arc42 template.

# Shown under the wordmark in the full masthead on /home/. `description` is
# written for search engines and reads as a fragment in a hero; this is the
# human-facing line.
tagline: The working reference for the arc42 architecture template.

# The arc42 logo in the masthead already reads "arc42", so the wordmark beside
# it says only what this site is. `title` stays the full name for <title>, SEO
# and the logo link's accessible name. Delete this key to show the full title.
masthead_title: Documentation
avatar: /assets/images/brand/arc42logosquare.webp
favicon: /assets/images/brand/arc42-favicon.svg
language: en

str_search: Search


#
# want subtle ads (on post-pages)
#
show-subtle-ads: true


#
# Social Icons
#
icons:
  github: arc42
  twitter: gernotstarke
  stack_overflow: arc42
  youtube: arc42-video
  devto: gernotstarke
  mastodon: gernotstarke
#
# Prettify url.
#
permalink: pretty


#
# plugins (formerly: Gems).
#
plugins:
#  - jekyll-paginate
  - jemoji
  - jekyll-github-metadata
  - jekyll-sitemap
  - jekyll-seo-tag



repository: arc42/docs.arc42.org-site


# define collection (as proposed in https://github.com/arc42/docs.arc42.org-site/issues/49)
#
# see: https://jekyllrb.com/docs/collections/
# ============================================


# define example collection
collections:
  examples:
    output: true


#
# !! Danger zone !!
#

sitemap: true

include:
  - _pages
  - _collections

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge


sass:
  sass_dir: _sass
  style: :compressed # or :expanded

exclude:
  - AGENTS.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CLAUDE.md
  - SECURITY.md
  - DESIGN.md
  - PRODUCT.md
  - .codex
  - .claude
  - .cursor
  - .impeccable
  - .github
  - .github/agents
  - agents
  - skills
  - prompts
  - originals
  - Dockerfile
  - tmp
  - docker
  - docker-compose.yml
  - .dockerignore
  - Makefile
  - scripts
  - _manage-site.sh
  - .gitignore
  - .vscode
  - _config-dev.yml
  - _docker-compose-dev.yml
  - docs-arc42-org-site.code-workspace
